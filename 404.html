<!doctype html>
<!--
  404 — GitHub Pages has no server to rewrite unknown paths, so a deep link or a
  mistyped URL lands here. Every route in this app is a hash (#play, #rules, …),
  so a request for a path that is not index.html is never a real page: send the
  visitor back to the app and let the router read the hash from the address bar.
  404.html is generated from index.html at deploy time by the Pages workflow;
  this file is the fallback for a branch deploy, where nothing rewrites it.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found · Fortress</title>
<style>
  body{background:#0c0d10;color:#e8eaed;font:16px/1.6 system-ui,Segoe UI,sans-serif;
       display:grid;place-items:center;min-height:100vh;margin:0;text-align:center}
  a{color:#f0b429}
</style>
</head>
<body>
  <div>
    <h1>That page is not here</h1>
    <p><a href="./">Back to the arena</a></p>
  </div>
</body>
</html>
